<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi LKH Guru</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-4">
    <h1 class="text-center mb-4">Aplikasi Laporan Kinerja Harian (LKH)</h1>

    <!-- Card: Identitas Laporan -->
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">Header Laporan</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="inputKelas" class="form-label">Kelas/Semester ({{kelas}})</label>
            <input type="text" class="form-control" id="inputKelas" placeholder="Contoh: VII / Ganjil">
          </div>
          <div class="col-md-4">
            <label for="inputTapel" class="form-label">Tahun Ajaran ({{tapel}})</label>
            <input type="text" class="form-control" id="inputTapel" placeholder="Contoh: 2023/2024">
          </div>
          <div class="col-md-4">
            <label for="inputBulan" class="form-label">Bulan ({{bulan}})</label>
            <input type="text" class="form-control" id="inputBulan" placeholder="Contoh: Januari 2024">
          </div>
        </div>
      </div>
    </div>

    <!-- Card: Input Log Harian -->
    <div class="card mb-4">
      <div class="card-header bg-success text-white">Input Log Harian</div>
      <div class="card-body">
        <form id="logForm">
          <div class="row g-3">
            <div class="col-md-2">
              <label for="logTanggal" class="form-label">Tanggal</label>
              <input type="date" class="form-control" id="logTanggal" required>
            </div>

            <!-- Tatap Muka Group -->
            <div class="col-md-10">
              <label class="form-label fw-bold">Kegiatan Tatap Muka</label>
              <div class="row g-2">
                <div class="col-md-4">
                  <input type="text" class="form-control" id="logKls" placeholder="KLS (Contoh: VII-A)">
                </div>
                <div class="col-md-4">
                  <input type="text" class="form-control" id="logCp" placeholder="CP (Capaian Pembelajaran)">
                </div>
                <div class="col-md-4">
                  <input type="text" class="form-control" id="logTp" placeholder="TP (Tujuan Pembelajaran)">
                </div>
              </div>
            </div>

            <!-- Non Tatap Muka & Lainnya -->
            <div class="col-md-4">
              <label for="logNonTatap" class="form-label">Non Tatap Muka</label>
              <textarea class="form-control" id="logNonTatap" rows="2" placeholder="Apel, Rapat, Piket, dll"></textarea>
            </div>
            <div class="col-md-2">
               <label for="logDok" class="form-label">Dokumentasi</label>
               <input type="text" class="form-control" id="logDok" placeholder="-">
            </div>
            <div class="col-md-2">
               <label for="logVol" class="form-label">Volume</label>
               <input type="text" class="form-control" id="logVol" placeholder="2 JP">
            </div>
            <div class="col-md-4">
               <label for="logKet" class="form-label">Keterangan</label>
               <textarea class="form-control" id="logKet" rows="2"></textarea>
            </div>
          </div>
          <div class="mt-3 text-end">
            <button type="submit" class="btn btn-primary">Simpan Log</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="card mb-4">
      <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
        <span>Daftar Agenda Harian</span>
        <button id="btnDownloadWord" class="btn btn-warning btn-sm fw-bold">Download Laporan Word</button>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-striped" id="logsTable">
            <thead>
              <tr>
                <th>No</th>
                <th>Tanggal</th>
                <th>Tatap Muka (Kls/CP/TP)</th>
                <th>Non Tatap Muka</th>
                <th>Dok</th>
                <th>Vol</th>
                <th>Ket</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <!-- Data injected via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="alert alert-info">
      <strong>Catatan:</strong> Pastikan file <code>template.docx</code> sudah ada di folder <code>public/</code> sebelum menekan tombol Download.
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pizzip/3.1.4/pizzip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip-utils/0.1.0/jszip-utils.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
